<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Step through cryptography one step at a time: classical ciphers, RSA, Diffie-Hellman and SHA-256, with the attacks that break the weak ones."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CS² for Everyone: computer science concept simulations</title>
    <script>
      // Apply the saved theme before the page paints, so there is no flash.
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
